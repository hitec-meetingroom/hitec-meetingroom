# Microsoft Graph → site/status-<room_id>.json 생성 → gh-pages 브랜치 배포
name: Sync room status

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "1회 실행에서 몇 번 publish 할지 (기본 1)"
        required: false
        default: "1"
  repository_dispatch:
    # 외부 cron(cron-job.org)에서 1분 간격으로 호출.
    # event_type: sync-rooms
    types: [sync-rooms]
  schedule:
    # 외부 cron이 죽었을 때 대비한 보조 트리거 (GitHub schedule은 throttle됨).
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-room-status
  # 1분 간격 트리거가 큐에 쌓이지 않도록, 진행 중이면 새 실행으로 교체.
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      MOCK_MODE: "false"
      TENANT_ID: ${{ secrets.TENANT_ID }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      DEFAULT_ROOM_ID: "201"
      ROOM_EMAIL_201: ${{ secrets.ROOM_EMAIL_201 }}
      ROOM_DISPLAY_NAME_201: "2층 교육실"
      ROOM_EMAIL_202: ${{ secrets.ROOM_EMAIL_202 }}
      ROOM_DISPLAY_NAME_202: "2층 소회의실"
      ROOM_EMAIL_203: ${{ secrets.ROOM_EMAIL_203 }}
      ROOM_DISPLAY_NAME_203: "2층 대회의실"
      ROOM_EMAIL_301: ${{ secrets.ROOM_EMAIL_301 }}
      ROOM_DISPLAY_NAME_301: "3층 소회의실1"
      ROOM_EMAIL_302: ${{ secrets.ROOM_EMAIL_302 }}
      ROOM_DISPLAY_NAME_302: "3층 소회의실2"
      ROOM_EMAIL_303: ${{ secrets.ROOM_EMAIL_303 }}
      ROOM_DISPLAY_NAME_303: "3층 대회의실"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_BRANCH: gh-pages
          # 외부 cron이 1분마다 호출하므로 기본 1회.
          # 보조 schedule(*/5)이나 수동 실행에서 여러 번 돌리고 싶으면 payload/input으로 조정.
          SYNC_ITERATIONS: ${{ github.event.client_payload.iterations || github.event.inputs.iterations || '1' }}
          SYNC_INTERVAL_SEC: "60"
        run: |
          for i in $(seq 1 "$SYNC_ITERATIONS"); do
            echo "Sync iteration ${i}/${SYNC_ITERATIONS}"
            bash scripts/publish_pages_once.sh
            if [ "$i" -lt "$SYNC_ITERATIONS" ]; then
              sleep "$SYNC_INTERVAL_SEC"
            fi
          done
