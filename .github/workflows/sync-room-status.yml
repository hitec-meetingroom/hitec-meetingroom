# Microsoft Graph → site/status-<room_id>.json 생성 → gh-pages 브랜치 배포
name: Sync room status

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "1회 실행에서 몇 번 publish 할지 (기본 5)"
        required: false
        default: "5"
  repository_dispatch:
    # 외부 cron(예: cron-job.org)에서 5분 간격으로 호출.
    # event_type: sync-rooms
    types: [sync-rooms]
  schedule:
    # GitHub schedule은 throttle 가능성이 있어 보조용으로만 사용.
    # 정상 작동 시 외부 ping이 더 정확함.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-room-status
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      MOCK_MODE: "false"
      TENANT_ID: ${{ secrets.TENANT_ID }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      DEFAULT_ROOM_ID: "201"
      ROOM_EMAIL_201: ${{ secrets.ROOM_EMAIL_201 }}
      ROOM_DISPLAY_NAME_201: "2층 교육실"
      ROOM_EMAIL_202: ${{ secrets.ROOM_EMAIL_202 }}
      ROOM_DISPLAY_NAME_202: "2층 소회의실"
      ROOM_EMAIL_203: ${{ secrets.ROOM_EMAIL_203 }}
      ROOM_DISPLAY_NAME_203: "2층 대회의실"
      ROOM_EMAIL_301: ${{ secrets.ROOM_EMAIL_301 }}
      ROOM_DISPLAY_NAME_301: "3층 소회의실1"
      ROOM_EMAIL_302: ${{ secrets.ROOM_EMAIL_302 }}
      ROOM_DISPLAY_NAME_302: "3층 소회의실2"
      ROOM_EMAIL_303: ${{ secrets.ROOM_EMAIL_303 }}
      ROOM_DISPLAY_NAME_303: "3층 대회의실"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish Pages every minute
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_BRANCH: gh-pages
          # repository_dispatch payload의 iterations 값을 우선 사용,
          # 없으면 workflow_dispatch input, 그것도 없으면 5회.
          SYNC_ITERATIONS: ${{ github.event.client_payload.iterations || github.event.inputs.iterations || '5' }}
          SYNC_INTERVAL_SEC: "60"
        run: |
          for i in $(seq 1 "$SYNC_ITERATIONS"); do
            echo "Sync iteration ${i}/${SYNC_ITERATIONS}"
            bash scripts/publish_pages_once.sh
            if [ "$i" -lt "$SYNC_ITERATIONS" ]; then
              sleep "$SYNC_INTERVAL_SEC"
            fi
          done
